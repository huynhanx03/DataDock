name: datadock

services:
  api:
    build:
      context: ..
      dockerfile: DataDock/api/Dockerfile
    env_file:
      - .env
    environment:
      DATADOCK_ENV: production
      DATADOCK_HTTP_HOST: 0.0.0.0
      DATADOCK_HTTP_PORT: 8080
      DATADOCK_DATA_PATH: /data/datadock.db
    volumes:
      - datadock-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: website/Dockerfile
      args:
        VITE_DATA_SOURCE: ${DATADOCK_WEB_DATA_SOURCE:-mock}
        VITE_API_BASE_URL: ${DATADOCK_WEB_API_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${DATADOCK_WEB_PORT:-8088}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  datadock-data:
